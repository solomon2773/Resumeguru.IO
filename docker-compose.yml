###############################################################################
# CareerOS - Docker Compose (Hybrid-Inference Architecture)
#
# Three deployment modes:
#
#   Mode A - Mac / no GPU (default):
#     docker compose up
#     → backend + frontend + qdrant
#     → LLM via llama.cpp (local model) or OpenAI API fallback
#
#   Mode B - NVIDIA GPU (full NIM stack):
#     docker compose --profile nim up
#     → All of Mode A + NIM LLM + NIM Vision + NIM Embeddings + Riva Speech + Piston
#     → Full local inference, maximum privacy
#
#   Dev mode - backend + frontend only:
#     docker compose up backend frontend
#
# Prerequisites:
#   Mode B only: NGC_API_KEY in .env, NVIDIA Container Toolkit installed
###############################################################################

services:
  # ── CareerOS Backend (FastAPI + LangGraph + PersonaPlex) ────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careeros-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-false}
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=sqlite:///./data/careeros.db
      # NIM - auto-detected at startup, these are defaults for Mode B
      - NIM_API_BASE=${NIM_API_BASE:-http://nim-llm:8000/v1}
      - NIM_MODEL=${NIM_MODEL:-meta/llama-3.1-70b-instruct}
      - NIM_API_KEY=${NIM_API_KEY:-not-needed-for-local}
      # PersonaPlex / Riva
      - PERSONAPLEX_URL=${PERSONAPLEX_URL:-http://nim-vision:8000}
      - RIVA_SPEECH_URL=${RIVA_SPEECH_URL:-riva-speech:50051}
      # Local model fallback (Mode A)
      - LOCAL_MODEL_PATH=${LOCAL_MODEL_PATH:-./models/llama-3.2-3b-instruct.Q4_K_M.gguf}
      # External API fallback
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
    volumes:
      - careeros-data:/app/data
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── CareerOS Frontend (Next.js Dashboard) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careeros-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Qdrant: Vector Database ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: careeros-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════
  # NVIDIA NIM Services (Mode B only - use with: --profile nim)
  # ════════════════════════════════════════════════════════════════════════

  # ── NVIDIA NIM: LLM (Llama 3.1 70B Instruct) ──────────────────────────
  nim-llm:
    image: nvcr.io/nim/meta/llama-3.1-70b-instruct:latest
    container_name: careeros-nim-llm
    profiles: ["nim"]
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_MAX_MODEL_LEN=8192
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8010:8000"
    volumes:
      - nim-llm-cache:/opt/nim/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── NVIDIA NIM: Vision (VILA) ───────────────────────────────────────────
  nim-vision:
    image: nvcr.io/nim/nvidia/vila:latest
    container_name: careeros-nim-vision
    profiles: ["nim"]
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8011:8000"
    volumes:
      - nim-vision-cache:/opt/nim/.cache
    restart: unless-stopped

  # ── NVIDIA NIM: Embeddings (NV-Embed) ──────────────────────────────────
  nim-embeddings:
    image: nvcr.io/nim/nvidia/nv-embedqa-e5-v5:latest
    container_name: careeros-nim-embeddings
    profiles: ["nim"]
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8012:8000"
    restart: unless-stopped

  # ── NVIDIA Riva: Speech (STT + TTS) ────────────────────────────────────
  riva-speech:
    image: nvcr.io/nvidia/riva/riva-speech:2.17.0
    container_name: careeros-riva-speech
    profiles: ["nim"]
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "50051:50051"
      - "8013:8000"
    restart: unless-stopped

  # ── Piston: Code Execution Sandbox ──────────────────────────────────────
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: careeros-piston
    profiles: ["nim"]
    ports:
      - "2000:2000"
    tmpfs:
      - /piston/jobs
    restart: unless-stopped

volumes:
  careeros-data:
    driver: local
  qdrant-data:
    driver: local
  nim-llm-cache:
    driver: local
  nim-vision-cache:
    driver: local
